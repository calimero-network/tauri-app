name: Setup build environment
description: Toolchain, caches and workspace dependencies shared by the desktop build workflows.

inputs:
  cache-suffix:
    description: Keeps the pnpm and cargo caches distinct per runner architecture.
    required: true
  rust-targets:
    description: Extra rustup targets, comma separated.
    required: false
    default: ""
  linux-deps:
    description: Install the apt packages the Linux Tauri bundlers need.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: inputs.linux-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          xdg-utils

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: "pnpm"

    - name: Get pnpm store directory
      id: get-pnpm-store
      shell: bash
      run: |
        STORE_PATH=$(pnpm store path --silent || echo "$HOME/.pnpm-store")
        echo "path=$STORE_PATH" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.get-pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ inputs.cache-suffix }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-suffix }}-pnpm-store-

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri
        key: ${{ inputs.cache-suffix }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
