name: Build Linux

# Covers x86_64 desktop Linux and the ARM64 build ARM Chromebooks need under the
# Crostini (Debian) container; Intel/AMD Chromebooks use the x86_64 build.

on:
  workflow_call:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        type: string
      platform:
        description: "Target to build: linux (x86_64) or chromebook (ARM64)"
        required: true
        type: string
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'chromebook' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        # A release builds one target per caller job; a PR validates both.
        platform: ${{ inputs.platform && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["linux","chromebook"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build mode
        id: build-mode
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=validation" >> $GITHUB_OUTPUT
            # Dependabot and fork PRs receive no secrets, so the signing key arrives as an
            # empty string, which Tauri treats as present and fails to decode.
            echo "config={\"bundle\":{\"createUpdaterArtifacts\":false}}" >> $GITHUB_OUTPUT
          else
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            echo "config={\"version\":\"$RELEASE_VERSION\",\"plugins\":{\"updater\":{\"pubkey\":\"$TAURI_PUBLIC_KEY\"}}}" >> $GITHUB_OUTPUT
          fi

      - name: Validate required secrets for release
        if: steps.build-mode.outputs.mode == 'release'
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        run: |
          MISSING=""
          [ -z "$TAURI_PRIVATE_KEY" ] && MISSING="$MISSING TAURI_PRIVATE_KEY"
          [ -z "$TAURI_PUBLIC_KEY" ] && MISSING="$MISSING TAURI_PUBLIC_KEY"

          if [ -n "$MISSING" ]; then
            echo "Error: Missing required secrets for signed release:$MISSING"
            echo "All releases must be signed. Set up the required secrets before releasing."
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-suffix: ${{ matrix.platform }}
          linux-deps: "true"

      - name: Prepare merod binary
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm merod:prepare

      - name: Strip merod binary
        run: |
          MEROD_BINARY="apps/desktop/src-tauri/merod/merod"
          if [ -f "$MEROD_BINARY" ]; then
            BEFORE=$(stat --printf="%s" "$MEROD_BINARY")
            strip "$MEROD_BINARY"
            AFTER=$(stat --printf="%s" "$MEROD_BINARY")
            echo "Stripped merod: $(( BEFORE / 1024 / 1024 ))MB -> $(( AFTER / 1024 / 1024 ))MB"
          else
            echo "Warning: merod binary not found at $MEROD_BINARY"
          fi

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # beforeBuildCommand runs merod:prepare again; reuse binary from "Prepare merod binary" (no GITHUB_TOKEN here).
          MEROD_SKIP_IF_EXISTS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        # ARM64 skips rpm: the .deb is the Crostini install path on ChromeOS and
        # the AppImage feeds the updater.
        run: >
          pnpm exec tauri build
          --bundles ${{ matrix.platform == 'chromebook' && 'appimage,deb' || 'appimage,deb,rpm' }}
          --config '${{ steps.build-mode.outputs.config }}'

      - name: Collect and normalize assets
        if: steps.build-mode.outputs.mode == 'release'
        run: |
          node scripts/release/collect-assets.cjs \
            --version "${{ steps.build-mode.outputs.version }}" \
            --platform ${{ matrix.platform }} \
            --output release-assets/

      - name: Upload artifacts
        if: steps.build-mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release-assets/
          retention-days: 7
