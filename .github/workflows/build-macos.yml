name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        type: string
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build macOS Universal
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build mode
        id: build-mode
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=validation" >> $GITHUB_OUTPUT
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            # Dependabot and fork PRs receive no secrets, so the signing key arrives as an
            # empty string, which Tauri treats as present and fails to decode.
            echo "config={\"bundle\":{\"createUpdaterArtifacts\":false}}" >> $GITHUB_OUTPUT
          else
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            # bundle.macOS.files embeds the profile at Contents/embedded.provisionprofile so
            # Tauri's own codesign seals it; the source path is relative to src-tauri/.
            echo "config={\"version\":\"$RELEASE_VERSION\",\"plugins\":{\"updater\":{\"pubkey\":\"$TAURI_PUBLIC_KEY\"}},\"bundle\":{\"macOS\":{\"files\":{\"embedded.provisionprofile\":\"embedded.provisionprofile\"}}}}" >> $GITHUB_OUTPUT
          fi

      - name: Validate required secrets for release
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        run: |
          MISSING=""
          [ -z "$APPLE_CERTIFICATE" ] && MISSING="$MISSING APPLE_CERTIFICATE"
          [ -z "$APPLE_SIGNING_IDENTITY" ] && MISSING="$MISSING APPLE_SIGNING_IDENTITY"
          [ -z "$APPLE_TEAM_ID" ] && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$APPLE_ID" ] && MISSING="$MISSING APPLE_ID"
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && MISSING="$MISSING APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$TAURI_PRIVATE_KEY" ] && MISSING="$MISSING TAURI_PRIVATE_KEY"
          [ -z "$TAURI_PUBLIC_KEY" ] && MISSING="$MISSING TAURI_PUBLIC_KEY"

          if [ -n "$MISSING" ]; then
            echo "Error: Missing required secrets for signed release:$MISSING"
            echo "All releases must be signed. Set up the required secrets before releasing."
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-suffix: universal
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Prepare merod binary
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm merod:prepare

      - name: Prepare calimero-shell binary (universal)
        working-directory: apps/desktop
        env:
          TAURI_TARGET_TRIPLE: universal-apple-darwin
        run: pnpm shell:prepare

      - name: Import Apple codesign cert
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          security default-keychain -s build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          rm -f certificate.p12

      - name: Sign merod binary before bundling
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          MEROD_BINARY="apps/desktop/src-tauri/merod/merod"
          ENTITLEMENTS="apps/desktop/src-tauri/merod.entitlements.plist"

          if [ -f "$MEROD_BINARY" ]; then
            echo "Signing merod binary before bundling: $MEROD_BINARY"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime \
              --timestamp \
              --entitlements "$ENTITLEMENTS" \
              "$MEROD_BINARY"
            
            codesign --verify --verbose "$MEROD_BINARY" || {
              echo "Failed to verify merod binary signature"
              exit 1
            }
            echo "Successfully signed merod binary"
          else
            echo "Warning: merod binary not found at $MEROD_BINARY (will be downloaded during build)"
          fi

      - name: Sign calimero-shell binary before bundling
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SHELL_BINARY="apps/desktop/src-tauri/shell/calimero-shell"
          # Nested helper: sign WITHOUT the managed universal-links entitlements
          # (see shell.entitlements.plist). Only the main app carries those.
          ENTITLEMENTS="apps/desktop/src-tauri/shell.entitlements.plist"

          if [ -f "$SHELL_BINARY" ]; then
            echo "Signing calimero-shell before bundling: $SHELL_BINARY"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime \
              --timestamp \
              --entitlements "$ENTITLEMENTS" \
              "$SHELL_BINARY"

            codesign --verify --verbose "$SHELL_BINARY" || {
              echo "Failed to verify calimero-shell signature"
              exit 1
            }
            echo "Successfully signed calimero-shell"
          else
            echo "Error: calimero-shell not found at $SHELL_BINARY"
            exit 1
          fi

          # Notarization rejects any unhardened Mach-O in the bundle.
          TRAMPOLINE="apps/desktop/src-tauri/shell/launcher-trampoline"
          if [ -f "$TRAMPOLINE" ]; then
            echo "Signing launcher-trampoline before bundling: $TRAMPOLINE"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime \
              --timestamp \
              "$TRAMPOLINE"

            codesign --verify --verbose "$TRAMPOLINE" || {
              echo "Failed to verify launcher-trampoline signature"
              exit 1
            }
            echo "Successfully signed launcher-trampoline"
          else
            echo "Error: launcher-trampoline not found at $TRAMPOLINE"
            exit 1
          fi

      - name: Install provisioning profile
        # The profile's embedded certificate MUST be the same Developer ID
        # Application cert that signs the app; a mismatch AMFI-kills it at launch.
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "Error: APPLE_PROVISIONING_PROFILE is required - a release carrying the"
            echo "universal-links entitlements is AMFI-killed at launch without it."
            exit 1
          fi
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > apps/desktop/src-tauri/embedded.provisionprofile
          BYTES=$(wc -c < apps/desktop/src-tauri/embedded.provisionprofile)
          echo "Wrote embedded.provisionprofile ($BYTES bytes)"
          [ "$BYTES" -gt 0 ] || { echo "Decoded profile is empty"; exit 1; }

      - name: Build Tauri app for macOS (Universal)
        working-directory: apps/desktop
        env:
          MEROD_SKIP_IF_EXISTS: "1"
          SHELL_SKIP_IF_EXISTS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only a release signs: a validation run has no keychain, and codesign
          # against an identity that is not in one fails the build.
          APPLE_SIGNING_IDENTITY: ${{ steps.build-mode.outputs.mode == 'release' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ steps.build-mode.outputs.mode == 'release' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.build-mode.outputs.mode == 'release' && secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.build-mode.outputs.mode == 'release' && secrets.TAURI_KEY_PASSWORD || '' }}
        run: >
          pnpm tauri build --target universal-apple-darwin
          --config '${{ steps.build-mode.outputs.config }}'

      - name: Cleanup keychain
        if: always() && steps.build-mode.outputs.mode == 'release'
        run: security delete-keychain build.keychain 2>/dev/null || true

      - name: Notarize DMG
        if: steps.build-mode.outputs.mode == 'release'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE=$(find apps/desktop/src-tauri/target -name "*.dmg" 2>/dev/null | head -1)

          if [ -z "$DMG_FILE" ]; then
            echo "No DMG found to notarize"
            exit 0
          fi

          SUBMIT_JSON=$(xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m \
            --output-format json)
          echo "$SUBMIT_JSON"
          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r .id)
          STATUS=$(echo "$SUBMIT_JSON" | jq -r .status)

          # Surface the notary's per-file findings; the bare status is useless.
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization $STATUS - notary log follows:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$DMG_FILE"

      - name: Collect and normalize assets
        if: steps.build-mode.outputs.mode == 'release'
        run: |
          node scripts/release/collect-assets.cjs \
            --version "${{ steps.build-mode.outputs.version }}" \
            --platform macos \
            --output release-assets/

      - name: Upload artifacts
        if: steps.build-mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release-assets/
          retention-days: 7
