name: Merod pins

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - merod-config.json
      - apps/desktop/scripts/**
      - .github/workflows/merod-pins.yml
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: merod-pins-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pins:
    name: Pins match the release
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - name: Recompute the pins and compare
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm merod:pin && git diff --exit-code && test -z "$(git status --porcelain)"
