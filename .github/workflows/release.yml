name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Extract version for downstream jobs
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

  # Build for each platform using reusable workflows
  build-macos:
    name: Build macOS
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      platform: linux
    secrets: inherit

  build-chromebook:
    name: Build Chromebook
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      platform: chromebook
    secrets: inherit

  # Publish release with all platform artifacts
  publish:
    name: Publish Release
    needs: [prepare, build-macos, build-windows, build-linux, build-chromebook]
    # Continue even if some platforms fail (partial release)
    if: always() && needs.prepare.result == 'success' && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-chromebook.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-build
          path: release-assets/

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build
          path: release-assets/

      - name: Download Linux artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-build
          path: release-assets/

      - name: Download Chromebook artifacts
        if: needs.build-chromebook.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chromebook-build
          path: release-assets/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - name: Generate latest.json and release.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release/generate-manifests.cjs \
            --version "$VERSION" \
            --repo "$REPO" \
            --assets release-assets/

      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          CHROMEBOOK_RESULT: ${{ needs.build-chromebook.result }}
        run: |

          # Build platform list with actual newlines
          PLATFORMS=""
          if [ "$MACOS_RESULT" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **macOS** (Universal): Download the DMG file"
          fi
          if [ "$WINDOWS_RESULT" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Windows** (64-bit): Download the installer"
          fi
          if [ "$LINUX_RESULT" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Linux** (64-bit): Download AppImage, deb, or rpm"
          fi
          if [ "$CHROMEBOOK_RESULT" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Chromebook** (ARM64): Download the deb (install via the Files app) or AppImage"
          fi

          cat > release-notes.md << EOF
          ## Calimero Desktop v${VERSION}

          ### Downloads
          ${PLATFORMS}

          ### Auto-Updates
          Existing installations will automatically update to this version.

          ### Checksums
          See \`release.json\` for file sizes and download URLs.
          EOF

          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |

          # Rerun-safe: a partial rerun (e.g. one platform job re-ran after
          # a flaky bundling failure) re-runs this job too, and the release
          # already exists from the first attempt — a bare `create` then
          # 422s (tag_name already exists) BEFORE any assets upload, leaving
          # the release missing the very platform the rerun fixed. Reuse the
          # existing release and let `--clobber` refresh the assets instead.
          if gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists — refreshing assets only (rerun)"
            gh release edit "v$VERSION" \
              --repo "$REPO" \
              --notes-file release-notes.md
          else
            # As a DRAFT: installed apps poll releases/latest/download/latest.json,
            # and a published release with its assets still uploading answers
            # that URL with a 404 — every client checking in that window saw a
            # failed update check. It goes public once every asset is in place.
            echo "Creating draft release v$VERSION"
            # --target: a dispatched release has no tag yet, and without it
            # the tag lands on master's head when this job runs, which may be
            # past the commit the platform jobs built. GITHUB_SHA is that commit.
            gh release create "v$VERSION" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              --draft
          fi

          echo "## Release v$VERSION Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY

          # --clobber so a rerun replaces first-attempt assets instead of failing.
          # manifest-<platform>.json is the internal handoff from collect-assets to
          # the generator, so it stays out of the release.
          # latest.json goes last: on a rerun of an already-public release the
          # manifest must never point at a bundle that is not uploaded yet.
          upload() {
            filename=$(basename "$1")
            echo "Uploading: $filename"
            gh release upload "v$VERSION" "$1" --repo "$REPO" --clobber
            echo "- \`$filename\` ($(ls -lh "$1" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          }
          for file in release-assets/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            case "$filename" in manifest-*.json|latest.json) continue ;; esac
            upload "$file"
          done
          upload release-assets/latest.json

          # Publish and mark latest only while it is still a draft (this run's, or
          # one a failed first attempt left) — a rerun of an old, already public
          # release must not snatch "latest" back from a newer one.
          IS_DRAFT=$(gh release view "v$VERSION" --repo "$REPO" --json isDraft -q .isDraft)
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "v$VERSION" \
              --repo "$REPO" \
              --draft=false \
              --latest
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/$REPO/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Page](https://calimero.network/download)" >> $GITHUB_STEP_SUMMARY
