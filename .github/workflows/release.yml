name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.0.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Extract version for downstream jobs
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

  # Build for each platform using reusable workflows
  build-macos:
    name: Build macOS
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      platform: linux
    secrets: inherit

  build-chromebook:
    name: Build Chromebook
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      platform: chromebook
    secrets: inherit

  # Publish release with all platform artifacts
  publish:
    name: Publish Release
    needs: [prepare, build-macos, build-windows, build-linux, build-chromebook]
    # Continue even if some platforms fail (partial release)
    if: always() && needs.prepare.result == 'success' && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-chromebook.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release-assets/

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets/

      - name: Download Linux artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets/

      - name: Download Chromebook artifacts
        if: needs.build-chromebook.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: chromebook-build
          path: release-assets/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Generate latest.json and release.json
        run: |
          node scripts/release/generate-manifests.cjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --assets release-assets/

      - name: Build release notes
        id: notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Build platform list with actual newlines
          PLATFORMS=""
          if [ "${{ needs.build-macos.result }}" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **macOS** (Universal): Download the DMG file"
          fi
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Windows** (64-bit): Download the installer"
          fi
          if [ "${{ needs.build-linux.result }}" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Linux** (64-bit): Download AppImage, deb, or rpm"
          fi
          if [ "${{ needs.build-chromebook.result }}" = "success" ]; then
            PLATFORMS="${PLATFORMS}"$'\n'"- **Chromebook** (ARM64): Download the deb (install via the Files app) or AppImage"
          fi

          cat > release-notes.md << EOF
          ## Calimero Desktop v${VERSION}

          ### Downloads
          ${PLATFORMS}

          ### Auto-Updates
          Existing installations will automatically update to this version.

          ### Checksums
          See \`release.json\` for file sizes and download URLs.
          EOF

          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Rerun-safe: a partial rerun (e.g. one platform job re-ran after
          # a flaky bundling failure) re-runs this job too, and the release
          # already exists from the first attempt — a bare `create` then
          # 422s (tag_name already exists) BEFORE any assets upload, leaving
          # the release missing the very platform the rerun fixed. Reuse the
          # existing release and let `--clobber` refresh the assets instead.
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists — refreshing assets only (rerun)"
            gh release edit "v$VERSION" \
              --repo "${{ github.repository }}" \
              --notes-file release-notes.md
          else
            echo "Creating release v$VERSION"
            gh release create "v$VERSION" \
              --repo "${{ github.repository }}" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              --latest
          fi

          echo "## Release v$VERSION Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY

          # --clobber so a rerun replaces first-attempt assets instead of failing.
          # manifest-<platform>.json is the internal handoff from collect-assets to
          # the generator, so it stays out of the release.
          for file in release-assets/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            case "$filename" in manifest-*.json) continue ;; esac

            echo "Uploading: $filename"
            gh release upload "v$VERSION" "$file" --repo "${{ github.repository }}" --clobber
            echo "- \`$filename\` ($(ls -lh "$file" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Page](https://${{ github.repository_owner }}.github.io/tauri-app/)" >> $GITHUB_STEP_SUMMARY
