name: Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  # PR pushes supersede each other; master pushes each need a verdict, and a
  # cancelled run renders as a red X on the commit.
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  vitest:
    name: Vitest (desktop)
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/desktop
        run: pnpm test:unit

  cargo:
    name: Cargo (desktop)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # No frontend build or resource staging: build.rs stubs what the tauri CLI
      # would have staged.
      - name: Run cargo tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
