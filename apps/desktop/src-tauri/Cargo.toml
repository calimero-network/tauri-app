[package]
name = "calimero-tauri-app"
version = "0.1.0"
description = "Calimero Tauri Desktop App"
authors = ["Calimero"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "http-all", "system-tray", "updater", "process-relaunch", "shell-open", "window-all", "dialog-all", "icon-png"] }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "process", "fs", "io-util", "sync", "macros", "rt"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
url = "2.5"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
toml = "0.8"
regex = "1.10"
thiserror = "1.0"
keyring = "2"
tauri-plugin-deep-link = "0.1"

# macOS: raw Objective-C interop to install a WKWebView media-capture delegate
# so WebRTC apps (Mero Meet) can use the camera/mic. Matches the objc/block
# versions wry already pulls in on this platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[profile.release]
strip = "symbols"
lto = true
opt-level = "s"
codegen-units = 1

[features]
default = ["custom-protocol", "autostart"]
custom-protocol = ["tauri/custom-protocol"]
autostart = ["dep:tauri-plugin-autostart"]
devtools = ["tauri/devtools"]

