[package]
name = "calimero-tauri-app"
version = "0.1.0"
description = "Calimero Tauri Desktop App"
authors = ["Calimero"]
license = ""
repository = ""
edition = "2021"
# Make the host the default binary so `tauri build` bundles it (never the shell).
default-run = "calimero-tauri-app"

# The per-app shell is a SEPARATE crate (workspace member) so tauri's bundler
# only sees this package's one binary (the host) and never copies the shell into
# Contents/MacOS/. A shared target dir avoids double-compiling the tauri stack.
[workspace]
members = ["calimero-shell"]

# Shared, pure (zero-Tauri-API) modules reused by both binaries.
[lib]
name = "calimero_tauri_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = { optional = true , version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "process", "fs", "io-util", "sync", "macros", "rt"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
url = "2.5"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
toml = "0.8"
thiserror = "1.0"
base64 = "0.22"
keyring = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
strip = "symbols"
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[[bin]]
name = "launcher-trampoline"
path = "src/bin/launcher_trampoline.rs"

[features]
default = ["custom-protocol", "autostart"]
custom-protocol = ["tauri/custom-protocol"]
autostart = ["dep:tauri-plugin-autostart"]
devtools = ["tauri/devtools"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

