[package]
name = "calimero-tauri-app"
version = "0.1.0"
description = "Calimero Tauri Desktop App"
authors = ["Calimero"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = { optional = true , version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "process", "fs", "io-util", "sync", "macros", "rt"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
url = "2.5"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
toml = "0.8"
regex = "1.10"
thiserror = "1.0"
keyring = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

[profile.release]
strip = "symbols"
lto = true
opt-level = "s"
codegen-units = 1

[features]
default = ["custom-protocol", "autostart"]
custom-protocol = ["tauri/custom-protocol"]
autostart = ["dep:tauri-plugin-autostart"]
devtools = ["tauri/devtools"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

