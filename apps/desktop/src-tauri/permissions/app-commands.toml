# App command permissions for the Tauri v2 ACL.
#
# The moment ANY app-command permission is defined, Tauri leaves its implicit
# "allow every command for local windows" mode and only recognises commands that
# have one; an unlisted command then fails with "<cmd> not allowed. Command not
# found". So `allow-app-commands` must list every command in main.rs's
# generate_handler!, which the test in main.rs enforces.

# The subset remote `app-*` windows get, for the injected proxy script.
# Granted by capabilities/remote.json.
[[permission]]
identifier = "allow-remote-proxy"
description = "Proxy and token-broker commands for app windows."
commands.allow = [
  "proxy_http_request",
  "proxy_sse_stream",
  "cancel_sse_stream",
  "broker_token_refresh",
]

# Everything, for the trusted local (main) window.
# Granted by capabilities/migrated.json.
[[permission]]
identifier = "allow-app-commands"
description = "All application commands, for trusted local (main) windows."
commands.allow = [
  "get_pending_open_app",
  "clear_pending_open_app",
  "hide_main_window",
  "focus_window",
  "create_desktop_shortcut",
  "open_app_launcher",
  "create_app_window",
  "webview_isolation_supported",
  "proxy_http_request",
  "proxy_sse_stream",
  "cancel_sse_stream",
  "broker_token_refresh",
  "resolve_token_request",
  "start_merod",
  "restart_merod",
  "stop_merod",
  "stop_merod_by_pid_command",
  "list_merod_nodes",
  "check_merod_health",
  "pick_directory",
  "pick_merod_binary",
  "init_merod_node",
  "detect_running_merod_nodes",
  "get_merod_logs",
  "clear_merod_logs",
  "export_merod_logs",
  "get_merod_binary_version",
  "download_and_replace_merod",
  "list_merod_releases",
  "list_installed_merod_versions",
  "remove_merod_version",
  "repoint_local_build",
  "set_tray_icon_connected",
  "delete_calimero_data_dir",
  "clear_app_sessions",
  "remove_app_launchers",
  "autostart_enable",
  "autostart_disable",
  "autostart_is_enabled",
  "open_url_in_browser",
  "write_mcp_agent_credentials",
  "get_pending_cloud_auth",
  "clear_pending_cloud_auth",
  "get_pending_app_deep_link",
  "clear_pending_app_deep_link",
  "get_current_app_deep_link",
]
