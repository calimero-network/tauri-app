packages:
  - 'apps/*'

overrides:
  postcss: '>=8.5.18'

# pnpm 10 stopped running dependency build scripts by default. Both of these
# ship native binaries and were already being built under pnpm 9.
allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@calimero-network/mero-js@13.1.0'
  - '@calimero-network/mero-react@6.0.0'
